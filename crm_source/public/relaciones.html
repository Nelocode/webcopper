<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌐 The Core — Mapa de Relaciones</title>
<!-- D3.js for force-directed graph -->
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  :root {
    --bg: #0a0b0e;
    --surface: #13151a;
    --border: #1e2030;
    --text: #e0e2e8;
    --text-dim: #7a7c8a;
    --accent: #f91117;
    --copper: #d4772c;
    --gold: #f0c040;
    --green: #22c55e;
    --blue: #3b82f6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    overflow: hidden;
  }
  #app {
    display: grid;
    grid-template-columns: 1fr 420px;
    grid-template-rows: 1fr;
    width: 100%;
    height: 100%;
    position: absolute;
    inset: 0;
  }

  #graph-container {
    position: relative;
    overflow: hidden;
    background: radial-gradient(ellipse at 30% 40%, #0f1118 0%, #08090a 100%);
  }
  #graph-container svg {
    width: 100%;
    height: 100%;
    position: relative;
    z-index: 2;
  }

  /* Neural network particle canvas overlay */
  #particles-canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
    opacity: 0.3;
  }

  /* Node glow effect */
  .node-glow {
    fill: currentColor;
    opacity: 0.20;
    transition: opacity 0.4s ease;
  }
  .node-group:hover .node-glow {
    opacity: 0.45;
  }
  .node-group:hover .node-circle {
    filter: brightness(1.4);
  }
  .node-ring {
    transition: opacity 0.3s ease;
  }
  .node-group:hover .node-ring {
    opacity: 0.6 !important;
    stroke-width: 1px;
  }
  .node-group {
    cursor: pointer;
    transition: opacity 0.3s ease;
  }
  .node-circle {
    transition: filter 0.4s ease, stroke-opacity 0.3s ease;
  }
  .node-label {
    pointer-events: none;
    font-size: 10px;
    fill: #9ca3af;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    transition: fill 0.4s ease, font-size 0.3s ease;
    opacity: 0.7;
  }
  .node-group:hover .node-label {
    fill: #e0e2e8;
    font-size: 11px;
    opacity: 1;
  }

  /* Hit area invisible */
  .node-hit {
    fill: transparent;
    cursor: pointer;
  }

  /* Link styles — gradient lines */
  .link-line {
    stroke: #2a2d3a;
    stroke-opacity: 0.2;
    transition: stroke-opacity 0.5s ease, stroke 0.4s ease, stroke-width 0.3s ease;
  }
  .link-group:hover .link-line,
  .link-group.highlighted .link-line {
    stroke-opacity: 0.7;
    stroke: #60a5fa;
    stroke-width: 2px;
  }

  /* Dimmed nodes on hover */
  .node-group.dimmed {
    opacity: 0.15;
    transition: opacity 0.3s;
  }

  /* Tooltip */
  #tooltip {
    position: absolute;
    background: rgba(19, 21, 26, 0.95);
    border: 1px solid rgba(30, 32, 48, 0.8);
    border-radius: 10px;
    padding: 14px 18px;
    font-size: 13px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s ease;
    max-width: 300px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 12px 48px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.03) inset;
    z-index: 100;
  }
  #tooltip.visible { opacity: 1; }
  #tooltip .name { font-weight: 700; font-size: 14px; color: var(--text); }
  #tooltip .role { color: var(--text-dim); font-size: 12px; margin-top: 2px; }
  #tooltip .org { color: var(--copper); font-size: 12px; }
  #tooltip .conns { color: var(--blue); font-size: 12px; margin-top: 4px; }
  #tooltip .intel { color: var(--gold); font-size: 11px; margin-top: 4px; font-style: italic; }

  /* Side panel */
  #side-panel {
    background: var(--surface);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .panel-tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
  }
  .panel-tabs button {
    flex: 1;
    padding: 10px 8px;
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    border-bottom: 2px solid transparent;
  }
  .panel-tabs button:hover { color: var(--text); }
  .panel-tabs button.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  .panel-content {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
  }
  .panel-content::-webkit-scrollbar { width: 4px; }
  .panel-content::-webkit-scrollbar-track { background: transparent; }
  .panel-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .panel-tab { display: none; }
  .panel-tab.active { display: block; }

  /* Table styles */
  .bridge-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .bridge-card:hover {
    border-color: var(--accent);
    transform: translateX(2px);
  }
  .bridge-card .b-name { font-weight: 600; font-size: 13px; }
  .bridge-card .b-role { color: var(--text-dim); font-size: 11px; }
  .bridge-card .b-org { color: var(--copper); font-size: 11px; }
  .bridge-card .b-conns { color: var(--blue); font-size: 11px; margin-top: 2px; }
  .bridge-card .b-email { color: var(--text-dim); font-size: 10px; font-family: monospace; }
  .bridge-card .b-score {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 10px;
    font-weight: 700;
    margin-top: 4px;
  }
  .score-high { background: #1a3a1a; color: var(--green); }
  .score-med { background: #3a2a1a; color: var(--gold); }
  .score-low { background: #2a1a2a; color: var(--blue); }

  .search-box {
    width: 100%;
    padding: 8px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 13px;
    margin-bottom: 12px;
    outline: none;
  }
  .search-box:focus { border-color: var(--accent); }
  .search-box::placeholder { color: var(--text-dim); }

  .filter-bar {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .filter-btn {
    padding: 4px 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    color: var(--text-dim);
    font-size: 11px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .filter-btn:hover { border-color: var(--text-dim); }
  .filter-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

  .org-header {
    font-size: 13px;
    font-weight: 700;
    color: var(--copper);
    padding: 8px 0 4px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 8px;
  }
  .org-count {
    font-weight: 400;
    color: var(--text-dim);
    font-size: 11px;
  }

  .legend {
    position: absolute;
    bottom: 16px;
    left: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 11px;
    display: flex;
    gap: 12px;
    pointer-events: none;
  }
  .legend-item { display: flex; align-items: center; gap: 4px; color: var(--text-dim); }
  .legend-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    display: inline-block;
  }

  /* Load status */
  #load-status {
    position: absolute;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.8);
    color: var(--text);
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 12px;
    z-index: 50;
    transition: opacity 1s ease;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="app">
  <div id="graph-container">
    <div id="load-status">Iniciando...</div>
    <canvas id="particles-canvas"></canvas>
    <svg id="graph"></svg>
    <div id="tooltip"></div>
    <div class="legend">
      <span class="legend-item"><span class="legend-dot" style="background:#f91117"></span> CEO/Presidente</span>
      <span class="legend-item"><span class="legend-dot" style="background:#d4772c"></span> Investment Banking</span>
      <span class="legend-item"><span class="legend-dot" style="background:#3b82f6"></span> Corp Dev</span>
      <span class="legend-item"><span class="legend-dot" style="background:#22c55e"></span> VP/Director</span>
      <span class="legend-item"><span class="legend-dot" style="background:#f0c040"></span> Investor Relations</span>
      <span class="legend-item"><span class="legend-dot" style="background:#6b7280"></span> Otro</span>
    </div>
  </div>

  <div id="side-panel">
    <div class="panel-tabs">
      <button class="active" data-tab="puentes">🌉 Puentes</button>
      <button data-tab="explorar">🔍 Explorar</button>
      <button data-tab="detalle">📋 Detalle</button>
    </div>
    <div class="panel-content">
      <div id="tab-puentes" class="panel-tab active"></div>
      <div id="tab-explorar" class="panel-tab">
        <input type="text" id="search-input" class="search-box" placeholder="Buscar contacto...">
        <div id="explore-list"></div>
      </div>
      <div id="tab-detalle" class="panel-tab"></div>
    </div>
  </div>
</div>

<script src="relaciones-app.js" defer></script>
</body>
</html>
