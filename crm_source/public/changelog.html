<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CORE | Changelog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #08090a;
      --surface: #0e0f12;
      --surface2: #16171c;
      --border: #1e2028;
      --text: #e8e8ed;
      --text-dim: #7a7a8a;
      --accent: #FF002C;
      --accent-glow: rgba(255, 0, 44, 0.12);
      --copper: #c17f3a;
      --copper-glow: rgba(193, 127, 58, 0.12);
      --green: #00d68f;
      --orange: #c17f3a;
      --red: #ff4444;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
    }
    .container {
      max-width: 960px;
      margin: 0 auto;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 32px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .header h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .header .badge {
      background: var(--accent-glow);
      color: var(--accent);
      font-size: 11px;
      font-weight: 600;
      padding: 2px 10px;
      border-radius: 100px;
      border: 1px solid rgba(255, 0, 44, 0.25);
    }
    .back-link {
      color: var(--text-dim);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 24px;
      transition: color 0.15s;
    }
    .back-link:hover { color: var(--text); }
    .contact-info {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .contact-info h2 {
      font-size: 18px;
      font-weight: 600;
    }
    .contact-info .email {
      color: var(--text-dim);
      font-size: 13px;
    }
    .contact-info .meta {
      display: flex;
      gap: 16px;
      font-size: 12px;
      color: var(--text-dim);
    }
    .contact-info .meta span {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      text-align: center;
    }
    .stat-card .value {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .stat-card .label {
      font-size: 11px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-top: 4px;
    }
    .stat-card.red .value { color: var(--accent); }
    .stat-card.green .value { color: var(--green); }
    .stat-card.copper .value { color: var(--copper); }
    .timeline {
      position: relative;
    }
    .timeline::before {
      content: '';
      position: absolute;
      left: 20px;
      top: 0;
      bottom: 0;
      width: 1px;
      background: var(--border);
    }
    .timeline-item {
      position: relative;
      padding: 0 0 20px 52px;
    }
    .timeline-item:last-child { padding-bottom: 0; }
    .timeline-dot {
      position: absolute;
      left: 14px;
      top: 4px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--surface2);
      border: 2px solid var(--border);
    }
    .timeline-dot.field { border-color: var(--accent); background: var(--accent-glow); }
    .timeline-dot.merge { border-color: var(--copper); background: var(--copper-glow); }
    .timeline-dot.create { border-color: var(--green); background: rgba(0, 214, 143, 0.12); }
    .timeline-entry {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 18px;
      transition: border-color 0.15s;
    }
    .timeline-entry:hover { border-color: var(--text-dim); }
    .entry-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 12px;
    }
    .entry-source {
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--surface2);
      color: var(--text-dim);
    }
    .entry-source.upsert { color: var(--accent); }
    .entry-source.manual_dedup { color: var(--copper); }
    .entry-source.create { color: var(--green); }
    .entry-date {
      color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
    }
    .entry-field {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }
    .entry-values {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      flex-wrap: wrap;
    }
    .value-old {
      color: var(--red);
      text-decoration: line-through;
      background: rgba(255, 107, 107, 0.08);
      padding: 2px 8px;
      border-radius: 4px;
    }
    .value-new {
      color: var(--green);
      background: rgba(0, 214, 143, 0.08);
      padding: 2px 8px;
      border-radius: 4px;
    }
    .value-arrow {
      color: var(--text-dim);
      font-size: 14px;
    }
    .entry-merged {
      font-size: 13px;
      color: var(--copper);
    }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-dim);
    }
    .empty-state svg {
      margin-bottom: 16px;
      opacity: 0.3;
    }
    .empty-state h3 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text);
    }
    .empty-state p {
      font-size: 13px;
    }
    .loading {
      text-align: center;
      padding: 60px;
      color: var(--text-dim);
    }
    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-state {
      text-align: center;
      padding: 60px 20px;
    }
    .error-state h3 {
      color: var(--accent);
      font-size: 16px;
      margin-bottom: 8px;
    }
    .error-state .detail {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--text-dim);
      background: var(--surface);
      padding: 8px 12px;
      border-radius: 6px;
      display: inline-block;
    }
    .search-box {
      margin-bottom: 24px;
    }
    .search-box input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
    }
    .search-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .search-box input::placeholder {
      color: var(--text-dim);
    }
    .search-results {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-top: 4px;
      max-height: 320px;
      overflow-y: auto;
      z-index: 100;
      box-shadow: 0 12px 32px rgba(0,0,0,0.4);
      display: none;
    }
    .search-results.show { display: block; }
    .search-result-item {
      padding: 10px 16px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
    }
    .search-result-item:last-child { border-bottom: none; }
    .search-result-item:hover { background: var(--surface2); }
    .search-result-item .name {
      font-size: 13px;
      font-weight: 600;
    }
    .search-result-item .email {
      font-size: 11px;
      color: var(--text-dim);
    }
    .search-wrapper {
      position: relative;
    }
    @media (max-width: 640px) {
      body { padding: 16px; }
      .stats-bar { grid-template-columns: 1fr; }
      .contact-info { flex-direction: column; align-items: flex-start; }
      .entry-values { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📋 Changelog</h1>
      <span class="badge">HISTORIAL DE CAMBIOS</span>
    </div>

    <div class="search-wrapper">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Buscar contacto por nombre o email..." autocomplete="off" />
      </div>
      <div class="search-results" id="searchResults"></div>
    </div>

    <div id="content">
      <div class="empty-state" id="initialState">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <h3>Busca un contacto</h3>
        <p>Escribe el nombre o email para ver su historial de cambios</p>
      </div>
    </div>
  </div>

  <script>
    let searchTimeout = null;
    let currentContactId = null;

    const searchInput = document.getElementById('searchInput');
    const searchResults = document.getElementById('searchResults');
    const content = document.getElementById('content');

    // Search contacts
    searchInput.addEventListener('input', () => {
      clearTimeout(searchTimeout);
      const q = searchInput.value.trim();
      if (q.length < 2) {
        searchResults.classList.remove('show');
        return;
      }
      searchTimeout = setTimeout(() => searchContacts(q), 200);
    });

    // Close results on click outside
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.search-wrapper')) {
        searchResults.classList.remove('show');
      }
    });

    async function searchContacts(q) {
      try {
        const res = await fetch('/api/contacts?limit=20&search=' + encodeURIComponent(q));
        const data = await res.json();
        const contacts = data.contacts || data;
        searchResults.innerHTML = '';
        if (contacts.length === 0) {
          searchResults.innerHTML = '<div class="search-result-item" style="color:var(--text-dim);font-size:12px;">Sin resultados</div>';
        } else {
          contacts.forEach(c => {
            const div = document.createElement('div');
            div.className = 'search-result-item';
            div.innerHTML = `<div class="name">${c.name || 'Sin nombre'}</div><div class="email">${c.email || ''}</div>`;
            div.addEventListener('click', () => {
              searchInput.value = c.name || c.email || '';
              searchResults.classList.remove('show');
              loadChangelog(c.id, c.name, c.email);
            });
            searchResults.appendChild(div);
          });
        }
        searchResults.classList.add('show');
      } catch (e) {
        searchResults.innerHTML = '<div class="search-result-item" style="color:var(--red);font-size:12px;">Error al buscar</div>';
        searchResults.classList.add('show');
      }
    }

    async function loadChangelog(contactId, name, email) {
      currentContactId = contactId;
      content.innerHTML = '<div class="loading"><div class="spinner"></div><p>Cargando historial...</p></div>';

      try {
        const [contactRes, logsRes] = await Promise.all([
          fetch('/api/contacts/' + contactId),
          fetch('/api/contacts/' + contactId + '/changelog')
        ]);
        const contact = await contactRes.json();
        const logs = await logsRes.json();

        const displayName = contact.name || name || 'Contacto';
        const displayEmail = contact.email || email || '';
        const totalChanges = logs.length || 0;
        const uniqueFields = [...new Set((logs || []).map(l => l.field))];
        const lastChange = logs && logs.length > 0
          ? new Date(logs[0].createdAt).toLocaleDateString('es-CO', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })
          : '—';

        let html = '';

        // Contact info header
        html += `
          <div class="contact-info">
            <div>
              <h2>${displayName}</h2>
              <div class="email">${displayEmail}</div>
            </div>
            <div class="meta">
              <span>🆔 ${contactId.slice(0, 8)}...</span>
            </div>
          </div>
        `;

        // Stats
        const mergeCount = (logs || []).filter(l => l.field === 'merged_from').length;
        const fieldChanges = (logs || []).filter(l => l.field !== 'merged_from').length;

        html += `
          <div class="stats-bar">
            <div class="stat-card red">
              <div class="value">${totalChanges}</div>
              <div class="label">Cambios totales</div>
            </div>
            <div class="stat-card green">
              <div class="value">${fieldChanges}</div>
              <div class="label">Cambios de campos</div>
            </div>
            <div class="stat-card copper">
              <div class="value">${mergeCount}</div>
              <div class="label">Fusiones</div>
            </div>
          </div>
        `;

        // Timeline
        if (!logs || logs.length === 0) {
          html += `
            <div class="empty-state">
              <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
              </svg>
              <h3>Sin cambios registrados</h3>
              <p>Este contacto no tiene historial de modificaciones</p>
            </div>
          `;
        } else {
          html += '<div class="timeline">';
          logs.forEach(log => {
            const date = new Date(log.createdAt);
            const dateStr = date.toLocaleDateString('es-CO', { year: 'numeric', month: 'short', day: 'numeric' });
            const timeStr = date.toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' });
            const dotClass = log.field === 'merged_from' ? 'merge' : 'field';

            html += '<div class="timeline-item">';
            html += `<div class="timeline-dot ${dotClass}"></div>`;
            html += '<div class="timeline-entry">';
            html += `<div class="entry-header">
              <span class="entry-source ${log.source}">${log.source.replace(/_/g, ' ')}</span>
              <span class="entry-date">${dateStr} ${timeStr}</span>
            </div>`;

            if (log.field === 'merged_from') {
              html += `<div class="entry-merged">🔀 Fusión: ${log.oldValue} → ${log.newValue}</div>`;
            } else {
              const fieldLabel = log.field.replace(/([A-Z])/g, ' $1').replace(/^./, s => s.toUpperCase());
              html += `<div class="entry-field">${fieldLabel}</div>`;
              html += '<div class="entry-values">';
              if (log.oldValue) {
                html += `<span class="value-old">${escapeHtml(log.oldValue)}</span>`;
              } else {
                html += `<span class="value-old" style="font-style:italic;opacity:0.5">(vacío)</span>`;
              }
              html += `<span class="value-arrow">→</span>`;
              if (log.newValue) {
                html += `<span class="value-new">${escapeHtml(log.newValue)}</span>`;
              } else {
                html += `<span class="value-new" style="font-style:italic;opacity:0.5">(eliminado)</span>`;
              }
              html += '</div>';
            }

            html += '</div></div>';
          });
          html += '</div>';
        }

        content.innerHTML = html;
      } catch (e) {
        content.innerHTML = `
          <div class="error-state">
            <h3>⚠️ Error al cargar</h3>
            <div class="detail">${escapeHtml(e.message)}</div>
          </div>
        `;
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // Check URL hash for direct contact link
    window.addEventListener('load', () => {
      const hash = window.location.hash.slice(1);
      if (hash) {
        // Could have format: #contact-id or #contact-id:name
        const parts = hash.split(':');
        const contactId = parts[0];
        const name = parts[1] || '';
        if (contactId) {
          loadChangelog(contactId, name, '');
        }
      }
    });
  </script>
</body>
</html>
