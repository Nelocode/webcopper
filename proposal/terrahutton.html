<!DOCTYPE html>

    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; overflow: hidden; font-family: 'Helvetica Neue', Arial, sans-serif; }
        .nav-bar { position: fixed; top: 0; left: 0; width: 100%; height: 60px; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); z-index: 999; display: flex; align-items: center; padding: 0 20px; box-sizing: border-box; border-bottom: 1px solid rgba(255,255,255,0.1); }

        .nav-back svg { margin-right: 8px; }
        .th-frame { width: 100%; height: 100vh; border: none; padding-top: 60px; box-sizing: border-box; }
        .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 100; display: flex; align-items: center; justify-content: center; color: #fff; flex-direction: column; transition: opacity 0.5s; pointer-events: none; }
        .spinner { border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid #e62314; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
