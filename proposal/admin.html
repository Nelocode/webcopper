<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CopperGiant™ | OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --bg-panel: #111111;
            --copper-primary: #d97736;
            --copper-hover: #b85c22;
            --text-main: #f4f4f4;
            --text-muted: #888888;
            --accent-blue: #0096ff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        /* Sidebar */
        .sidebar {
            width: 280px;
            background-color: var(--bg-panel);
            border-right: 1px solid rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            padding: 30px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .sidebar-header img {
            width: 40px;
            height: auto;
        }
        .sidebar-header h1 {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .nav-menu {
            padding: 20px 0;
            flex-grow: 1;
        }
        .nav-item {
            padding: 15px 25px;
            display: flex;
            align-items: center;
            gap: 15px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            font-size: 0.95rem;
            border-left: 3px solid transparent;
        }
        .nav-item:hover {
            color: var(--text-main);
            background: rgba(255,255,255,0.02);
        }
        .nav-item.active {
            color: var(--copper-primary);
            border-left: 3px solid var(--copper-primary);
            background: linear-gradient(90deg, rgba(217,119,54,0.1) 0%, transparent 100%);
        }
        /* Main Content area */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .system-status {
            padding: 20px;
            font-size: 0.75rem;
            color: #555;
            font-family: 'Roboto Mono', monospace;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        .loading-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            color: var(--copper-primary);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .loading-overlay.active {
            opacity: 1;
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header">
            <svg width="40" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M50 0L93.3013 25V75L50 100L6.69873 75V25L50 0Z" fill="#D97736"/>
                <path d="M50 20L75.9808 35V65L50 80L24.0192 65V35L50 20Z" fill="#0A0A0A"/>
            </svg>
            <div>
                <h1>Copper Giant</h1>
                <div style="font-size: 0.7rem; color: var(--copper-primary); letter-spacing: 2px;">OPERATING SYSTEM</div>
            </div>
        </div>

        <nav class="nav-menu">
            <div class="nav-item active" onclick="switchTab('omni', this)">
                <i data-lucide="satellite-dish"></i> Omnichannel Center
            </div>
            <div class="nav-item" onclick="switchTab('crm', this)">
                <i data-lucide="users"></i> Intelligence CRM
            </div>
            <div class="nav-item" onclick="switchTab('warroom', this)">
                <i data-lucide="target"></i> War Room
            </div>
            <div class="nav-item" onclick="switchTab('kaizen', this)">
                <i data-lucide="brain-circuit"></i> Kaizen Engine
            </div>
        </nav>

        <div class="system-status">
            <div style="display:flex; justify-content:space-between; margin-bottom:5px;"><span>SYSTEM:</span><span style="color:#00ff64;">ONLINE</span></div>
            <div style="display:flex; justify-content:space-between;"><span>SECURE:</span><span>AES-256</span></div>
        </div>
    </aside>

    <main class="main-content">
        <div class="loading-overlay" id="loader">
            <i data-lucide="loader-2" class="lucide-spin" style="width: 40px; height: 40px;"></i>
        </div>
        <iframe id="main-frame" src="omnichannel.html"></iframe>
    </main>

    <script>
        lucide.createIcons();

        const routes = {
            'omni': 'omnichannel.html',
            'crm': '/crm',
            'warroom': '/crm/war-room',
            'kaizen': 'admin-kaizen.html'
        };

        function switchTab(tabId, element) {
            // Update active styling
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');

            // Show loader
            const loader = document.getElementById('loader');
            const frame = document.getElementById('main-frame');
            loader.classList.add('active');

            // Change iframe source
            frame.src = routes[tabId];

            // Hide loader after load
            frame.onload = () => {
                loader.classList.remove('active');
            };
        }
    </script>
</body>
</html>
