<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copper Brain - AI Multi-Agent Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow-x: hidden; background-color: #050505; color: #fff; font-family: 'Inter', sans-serif; }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; opacity: 0.6; }
        .glass-panel { background: rgba(20, 20, 20, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; }
        .agent-header { border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 1rem; margin-bottom: 1rem; }
        .tag-mio { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.5); }
        .tag-copper { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.5); }
        .tag-anti { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.5); }
        .glow-text { text-shadow: 0 0 10px rgba(255,255,255,0.3); }
        .card-entry { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.05); border-radius: 8px; padding: 1rem; margin-bottom: 1rem; transition: all 0.3s ease; }
        .card-entry:hover { border-color: rgba(255,255,255,0.2); transform: translateY(-2px); }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.4); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <div id="canvas-container"></div>

    <nav class="glass-panel mx-6 mt-6 p-4 flex justify-between items-center z-10">
        <div class="flex items-center gap-3">
            <div class="w-3 h-3 rounded-full bg-green-500 animate-pulse"></div>
            <h1 class="text-xl font-bold tracking-widest uppercase glow-text">Copper Brain <span class="text-gray-400 text-sm">v1.0.0</span></h1>
        </div>
        <div class="flex gap-4 text-sm font-medium">
            <span class="px-3 py-1 rounded-full tag-mio">Mio Connected</span>
            <span class="px-3 py-1 rounded-full tag-copper">Copper Mind Connected</span>
            <span class="px-3 py-1 rounded-full tag-anti">Antigravity Connected</span>
        </div>
    </nav>

    <main class="flex-grow p-6 grid grid-cols-1 lg:grid-cols-3 gap-6 z-10">
        
        <!-- MIO PANEL -->
        <section class="glass-panel p-6 flex flex-col max-h-[80vh]">
            <div class="agent-header flex justify-between items-center">
                <div>
                    <h2 class="text-2xl font-bold text-blue-400">Mio</h2>
                    <p class="text-xs text-gray-400 uppercase tracking-wider">Strategic Directives</p>
                </div>
                <svg class="w-8 h-8 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
            </div>
            <div id="mio-feed" class="flex-grow overflow-y-auto pr-2 space-y-4">
                <div class="text-gray-500 text-sm text-center mt-10">Awaiting strategic directives...</div>
            </div>
            <div class="mt-4 pt-4 border-t border-gray-800">
                <button onclick="simulateMio()" class="w-full py-2 bg-blue-600/20 hover:bg-blue-600/40 border border-blue-500/30 text-blue-300 rounded transition-colors text-sm font-medium">TEST: Inject Strategic Rule</button>
            </div>
        </section>

        <!-- COPPER MIND PANEL -->
        <section class="glass-panel p-6 flex flex-col max-h-[80vh]">
            <div class="agent-header flex justify-between items-center">
                <div>
                    <h2 class="text-2xl font-bold text-yellow-400">Copper Mind</h2>
                    <p class="text-xs text-gray-400 uppercase tracking-wider">Operational Tasks</p>
                </div>
                <svg class="w-8 h-8 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
            </div>
            <div id="copper-feed" class="flex-grow overflow-y-auto pr-2 space-y-4">
                <div class="text-gray-500 text-sm text-center mt-10">Awaiting operational tasks...</div>
            </div>
            <div class="mt-4 pt-4 border-t border-gray-800">
                <button onclick="simulateCopper()" class="w-full py-2 bg-yellow-600/20 hover:bg-yellow-600/40 border border-yellow-500/30 text-yellow-300 rounded transition-colors text-sm font-medium">TEST: Inject Task</button>
            </div>
        </section>

        <!-- ANTIGRAVITY PANEL -->
        <section class="glass-panel p-6 flex flex-col max-h-[80vh]">
            <div class="agent-header flex justify-between items-center">
                <div>
                    <h2 class="text-2xl font-bold text-green-400">Antigravity</h2>
                    <p class="text-xs text-gray-400 uppercase tracking-wider">Technical Server State</p>
                </div>
                <svg class="w-8 h-8 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01"></path></svg>
            </div>
            <div id="anti-feed" class="flex-grow overflow-y-auto pr-2 space-y-4">
                <div class="text-gray-500 text-sm text-center mt-10">Awaiting technical logs...</div>
            </div>
            <div class="mt-4 pt-4 border-t border-gray-800">
                <button onclick="simulateAnti()" class="w-full py-2 bg-green-600/20 hover:bg-green-600/40 border border-green-500/30 text-green-300 rounded transition-colors text-sm font-medium">TEST: Inject Server Log</button>
            </div>
        </section>

    </main>

    <script>
        // --- 3D NEURAL NETWORK BACKGROUND (Three.js) --- //
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 300;
        const posArray = new Float32Array(particlesCount * 3);

        for(let i = 0; i < particlesCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 10;
        }
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const material = new THREE.PointsMaterial({ size: 0.02, color: 0x4B5563, transparent: true, opacity: 0.8 });
        const particlesMesh = new THREE.Points(particlesGeometry, material);
        scene.add(particlesMesh);

        // Lines connecting particles
        const lineMaterial = new THREE.LineBasicMaterial({ color: 0x374151, transparent: true, opacity: 0.15 });
        const linesMesh = new THREE.LineSegments(particlesGeometry, lineMaterial);
        scene.add(linesMesh);

        camera.position.z = 3;

        // Mouse interaction
        let mouseX = 0;
        let mouseY = 0;
        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth) - 0.5;
            mouseY = (e.clientY / window.innerHeight) - 0.5;
        });

        const animate = () => {
            requestAnimationFrame(animate);
            particlesMesh.rotation.y += 0.001;
            linesMesh.rotation.y += 0.001;
            
            // Subtle camera follow
            camera.position.x += (mouseX * 0.5 - camera.position.x) * 0.05;
            camera.position.y += (-mouseY * 0.5 - camera.position.y) * 0.05;
            camera.lookAt(scene.position);
            
            renderer.render(scene, camera);
        };
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- API FETCHING LOGIC --- //
        const formatDate = (isoString) => {
            const d = new Date(isoString);
            return d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});
        };

        const renderDirectives = (data) => {
            const container = document.getElementById('mio-feed');
            if(data.length === 0) return;
            container.innerHTML = data.map(d => `
                <div class="card-entry border-l-4 border-l-blue-500">
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-blue-300 font-bold text-sm">${d.title}</span>
                        <span class="text-xs text-gray-500">${formatDate(d.created_at)}</span>
                    </div>
                    <p class="text-gray-300 text-sm leading-relaxed">${d.content}</p>
                </div>
            `).join('');
        };

        const renderTasks = (data) => {
            const container = document.getElementById('copper-feed');
            if(data.length === 0) return;
            container.innerHTML = data.map(d => `
                <div class="card-entry border-l-4 border-l-yellow-500">
                    <div class="flex justify-between items-start mb-2">
                        <span class="px-2 py-0.5 rounded text-xs font-bold uppercase ${d.status === 'done' ? 'bg-green-500/20 text-green-400' : 'bg-yellow-500/20 text-yellow-400'}">${d.status}</span>
                        <span class="text-xs text-gray-500">${formatDate(d.created_at)}</span>
                    </div>
                    <p class="text-gray-300 text-sm leading-relaxed">${d.description}</p>
                </div>
            `).join('');
        };

        const renderState = (data) => {
            const container = document.getElementById('anti-feed');
            if(data.length === 0) return;
            container.innerHTML = data.map(d => `
                <div class="card-entry border-l-4 border-l-green-500">
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-green-300 font-bold text-sm font-mono">[${d.component}]</span>
                        <span class="text-xs text-gray-500">${formatDate(d.updated_at)}</span>
                    </div>
                    <p class="text-gray-300 text-sm font-mono leading-relaxed">${d.status_report}</p>
                </div>
            `).join('');
        };

        const fetchData = async () => {
            try {
                const [dirRes, taskRes, stateRes] = await Promise.all([
                    fetch('/api/brain/directives'),
                    fetch('/api/brain/tasks'),
                    fetch('/api/brain/state')
                ]);
                const directives = await dirRes.json();
                const tasks = await taskRes.json();
                const state = await stateRes.json();
                
                renderDirectives(directives);
                renderTasks(tasks);
                renderState(state);
            } catch (err) {
                console.error("API Error", err);
            }
        };

        // Poll every 3 seconds
        setInterval(fetchData, 3000);
        fetchData(); // Initial load

        // TEST SIMULATORS
        window.simulateMio = () => {
            fetch('/api/brain/directives', {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ title: "System Audit Rule A.1", content: "All future deployments must verify that the 404 handler returns HTTP 404 strictly, not 200."})
            }).then(fetchData);
        };
        window.simulateCopper = () => {
            fetch('/api/brain/tasks', {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ description: "Orchestrating test sweep across server.js routes. Assigning to Antigravity."})
            }).then(fetchData);
        };
        window.simulateAnti = () => {
            fetch('/api/brain/state', {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ component: "server.js", status_report: "Test sweep complete. Commit 45b88c applied to Nelocode/webcopper."})
            }).then(fetchData);
        };
    </script>
</body>
</html>
